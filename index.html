<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk American</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to Talk American</h1>
        <p>Master your American English fluency through imitation.</p>
    </header>
    <main>
        <section>
            <h2>Practice Listening and Speaking</h2>
            <p>Click play to hear the native speaker, then record yourself and compare.</p>
            <audio controls>
                <source src="audio/example.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <button id="record-btn">Record Your Voice</button>
            <button id="play-btn" disabled>Play Your Recording</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Talk American. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
